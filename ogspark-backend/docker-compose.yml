version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ogspark_db
    environment:
      POSTGRES_DB: ogspark
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ogspark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ogspark"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ogspark_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ogspark-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  ogspark-network:
    driver: bridge